version: '3.8'

services:
  api:
    build: .
    container_name: fact-layer-api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - DATABASE_URL=sqlite:////app/data/facts.db
      - FAISS_INDEX_PATH=/app/data/facts.faiss
    restart: unless-stopped

  ui:
    build: .
    container_name: fact-layer-ui
    command: streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - DATABASE_URL=sqlite:////app/data/facts.db
      - FAISS_INDEX_PATH=/app/data/facts.faiss
    depends_on:
      - api
    restart: unless-stopped
