<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Veridex Fact Knowledge Layer workflow</title><desc id="desc">The knowledge layer extracts facts from multiple documents, preserves provenance, checks relationships and contradictions, and returns grounded results for a query.</desc><rect width="1200" height="400" rx="18" fill="#EFF4F5"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#287C78">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#263742">Veridex Fact Knowledge Layer</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#657985">Cross-document facts to traceable answers</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D6E1E5"/><path d="M 300 237 L 330 237" stroke="#657985" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#657985" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#657985" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#657985" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#657985" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#657985" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6E1E5" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#287C78"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#287C78">01 / SOURCES</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#263742">Multiple documents</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657985">Load the evidence to compare.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6E1E5" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#3F739A"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#3F739A">02 / EXTRACT</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#263742">Facts + provenance</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657985">Normalise claims and source spans.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6E1E5" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#A6844B"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#A6844B">03 / RECONCILE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#263742">Check relationships</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657985">Compare support and contradictions.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6E1E5" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#287C78"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#287C78">04 / ANSWER</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#263742">Grounded result</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657985">Return a traceable answer.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#287C78">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657985">Confidence and benchmark results depend on the evaluation set; inspect cited evidence for high-impact use.</text></svg>