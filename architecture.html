<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veridex Fact Knowledge Layer Architecture</title><style>:root{--bg:#EFF4F5;--ink:#263742;--muted:#657985;--line:#D6E1E5;--card:#FFFFFF;--a:#287C78;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,4vw,56px);background:var(--bg);color:var(--ink)}main{max-width:1200px;margin:auto}.tag{color:var(--a);text-transform:uppercase;letter-spacing:.15em;font-size:.75rem;font-weight:800}h1{font-size:clamp(2rem,5vw,3rem)}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:36px 0}.stage{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:200px;text-align:left;cursor:pointer;transition:transform .25s,border-color .25s}.stage:hover,.stage:focus-visible,.stage[aria-pressed=true]{transform:translateY(-5px);border-color:var(--a);outline:none}.stage h2{font-size:1.1rem}.stage p{font-size:.9rem}.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}</style></head><body><main><div class="tag">Interactive architecture</div><h1>Veridex Fact Knowledge Layer</h1><p>Extract facts across documents and return answers with traceable evidence. Select a stage to inspect its role.</p><section class="grid"><button class="stage" type="button" aria-pressed="true" data-i="0"><span class="tag">Stage 1 / SOURCES</span><h2>Documents</h2><p>Load the evidence to compare.</p></button><button class="stage" type="button" aria-pressed="false" data-i="1"><span class="tag">Stage 2 / EXTRACT</span><h2>Facts + provenance</h2><p>Normalise claims and source spans.</p></button><button class="stage" type="button" aria-pressed="false" data-i="2"><span class="tag">Stage 3 / RECONCILE</span><h2>Check relationships</h2><p>Compare support and contradictions.</p></button><button class="stage" type="button" aria-pressed="false" data-i="3"><span class="tag">Stage 4 / ANSWER</span><h2>Grounded result</h2><p>Return a traceable answer.</p></button></section><section class="detail" aria-live="polite"><h2 id="heading">Documents</h2><p id="body">Load the evidence to compare.</p></section><p><a href="https://github.com/chyk2468/Veridex" style="color:var(--a)">View repository</a></p></main><script>const stages=[["SOURCES","Documents","Load the evidence to compare."],["EXTRACT","Facts + provenance","Normalise claims and source spans."],["RECONCILE","Check relationships","Compare support and contradictions."],["ANSWER","Grounded result","Return a traceable answer."]];document.querySelectorAll('.stage').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.stage').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.querySelector('#heading').textContent=stages[+b.dataset.i][1];document.querySelector('#body').textContent=stages[+b.dataset.i][2]}))</script></body></html>
